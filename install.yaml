# Details about the install.yaml file are at https://ddev.readthedocs.io/en/stable/users/extend/additional-services/#sections-and-features-of-ddev-get-add-on-installyaml

name: typo3-git-worktree

# should work with any DDEV version
ddev_version_constraint: '>= v1.24.10'

# worktree commands will be stored globally
global_files:
  - commands/host/generate-worktree-config
  - commands/host/generate-worktree-ddev-config
  - commands/host/generate-worktree-site-config

